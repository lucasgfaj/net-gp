[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:queue]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/artisan queue:work --daemon --sleep=3 --tries=3 --max-time=60
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
redirect_stderr=true
stdout_logfile=/var/www/storage/logs/supervisor_queue.log

[program:scheduler]
process_name=%(program_name)s
command=bash -c "while true; do php /var/www/artisan schedule:run; sleep 60; done"
autostart=true
autorestart=true
startsecs=0
user=www-data
redirect_stderr=true
stdout_logfile=/var/www/storage/logs/supervisor_scheduler.log